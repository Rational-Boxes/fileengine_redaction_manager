[project]
name = "redaction-manager"
version = "0.1.0"
description = "FileEngine offsite redaction: destroy approved payloads in the backup account, on demand, with a human in the authorisation path"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "James Hickman", email = "james@rationalboxes.com"}]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",             # the ONLY thing here that can delete, and only via STS
    "fastapi>=0.110",          # the local review UI, started for the operation and stopped
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]
# DELIBERATELY ABSENT, and each absence is a design decision rather than an
# oversight — see design_documents/PROPOSAL_offsite_redaction.md §5:
#
#   python_interface / grpcio  — this runs on the BACKUP account and must have
#                                no route to the deployment. It cannot call the
#                                core, and should not be able to.
#   ldap3                      — it does not authenticate FileEngine principals.
#                                Its operator signs in to the backup account,
#                                with credentials that have never been on the
#                                droplet.
#   redis / psycopg            — it consumes no stream and owns no database. Its
#                                input is a file a human uploaded; its output is
#                                a receipt.
#
# Every dependency added here is reach granted to the one application in the
# estate that can destroy backup history.

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "httpx>=0.27", "moto>=5.0"]

[project.scripts]
redaction-manager = "redaction_manager.app:main"   # on-demand; loopback UI

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: needs a real bucket; never run against a production one"]
